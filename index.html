<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a6b5a">
<title>诗境闯关 · 唐诗宋词学习游戏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231a6b5a'/><text x='50' y='70' font-size='52' text-anchor='middle' fill='white'>诗</text></svg>">
<style>
:root{
  --ink:#2F3A34; --ink2:#71807A; --line:#E3E8E4;
  --bg1:#EAF4EE; --bg2:#F7F3E8;
  --card:#FFFFFF;
  --green:#1A8F6E; --green-d:#126E55;
  --gold:#D9A441; --red:#D65A4A;
  --blue:#4A7FB5;
  --sh:0 6px 20px rgba(26,107,90,.10);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Songti SC","STSong","SimSun","Microsoft YaHei",serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;
}
#app{position:relative;height:100%;width:100%;max-width:560px;margin:0 auto;overflow:hidden;}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(var(--safe-b) + 10px);
  opacity:0;visibility:hidden;transform:translateX(28px);
  transition:opacity .25s,transform .25s,visibility .25s;
  overflow:hidden;
}
.screen.active{opacity:1;visibility:visible;transform:none;}

/* ---------- 首页 ---------- */
.home-head{text-align:center;padding:10px 0 4px;position:relative;}
.home-head .back{
  position:absolute;left:0;top:16px;width:38px;height:38px;border-radius:12px;border:none;
  background:#fff;box-shadow:0 3px 10px rgba(26,107,90,.15);font-size:16px;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;
}
.seal{
  display:inline-flex;align-items:center;justify-content:center;width:78px;height:78px;
  border-radius:20px;background:linear-gradient(150deg,#20795F,#14584A);
  color:#fff;font-size:38px;font-weight:900;font-family:"Songti SC","STSong","SimSun",serif;
  box-shadow:0 12px 26px rgba(20,88,74,.35);animation:floaty 3.2s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.title{font-size:28px;font-weight:900;margin-top:12px;letter-spacing:3px;font-family:"Songti SC","STSong","SimSun",serif;}
.title em{
  font-style:normal;color:var(--gold);
  text-shadow:0 1px 0 rgba(217,164,65,.25);
}
.subtitle{font-size:12px;color:var(--ink2);margin-top:6px;letter-spacing:1px;}
.poem-quote{
  margin:12px auto 0;max-width:330px;text-align:center;font-size:14px;color:var(--ink2);
  font-family:"Songti SC","STSong","SimSun",serif;letter-spacing:1px;line-height:1.7;
  padding:10px 18px;border-radius:14px;background:rgba(255,255,255,.65);
  border:1px solid rgba(217,164,65,.35);
}
.poem-quote b{color:var(--gold);font-size:12px;display:block;margin-top:4px;letter-spacing:2px;}

.stage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:16px;}
.stage{
  background:#fff;border-radius:20px;padding:15px 6px 13px;text-align:center;cursor:pointer;
  box-shadow:var(--sh);border:2px solid transparent;transition:.18s;position:relative;overflow:hidden;
}
.stage:active{transform:scale(.96);}
.stage .glyph{font-size:30px;font-family:"Songti SC","SimSun",serif;font-weight:900;line-height:1.1;}
.stage .nm{font-size:13px;font-weight:800;margin-top:7px;}
.stage .info{font-size:10px;color:var(--ink2);margin-top:3px;font-weight:600;}
.stage .bar{height:5px;border-radius:3px;background:#EDF1EE;margin:9px 12px 0;overflow:hidden;}
.stage .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#D9A441,#E7BC63);}
.stage.primary .glyph{color:#1A8F6E}.stage.junior .glyph{color:#4A7FB5}.stage.senior .glyph{color:#B5722A}
.stage.locked{opacity:.55;filter:grayscale(.4);}

.stat-row{display:flex;gap:10px;margin-top:14px;}
.stat-c{
  flex:1;background:#fff;border-radius:16px;padding:11px 4px;text-align:center;box-shadow:var(--sh);
}
.stat-c .v{font-size:18px;font-weight:900;color:var(--green);font-variant-numeric:tabular-nums;}
.stat-c .k{font-size:10px;color:var(--ink2);font-weight:700;margin-top:2px;}
.home-scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-bottom:4px;
  mask-image:linear-gradient(180deg,#000 calc(100% - 16px),transparent);
  -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 16px),transparent);
}
.home-foot{
  margin-top:0;display:flex;gap:10px;padding-top:10px;padding-bottom:2px;
  background:var(--bg);box-shadow:0 -8px 18px rgba(26,107,90,.07);
}
.home-foot .btn{flex:1;font-size:17px;padding:16px 8px;letter-spacing:.5px;}
.btn{
  border:none;font-family:inherit;font-weight:800;color:#fff;border-radius:16px;cursor:pointer;
  font-size:16px;padding:14px;transition:transform .08s,box-shadow .08s;
  background:linear-gradient(180deg,#209A77,#1A8F6E);box-shadow:0 5px 0 #126E55,0 10px 20px rgba(26,143,110,.3);
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #126E55;}
.btn.ghost{background:#fff;color:var(--green);box-shadow:0 5px 0 #E2E9E4,0 8px 16px rgba(26,107,90,.1);}
.btn.ghost:active{box-shadow:0 2px 0 #E2E9E4;}
.btn.gold{background:linear-gradient(180deg,#E2B055,#D9A441);box-shadow:0 5px 0 #B58430,0 10px 20px rgba(217,164,65,.3);}
.btn.gold:active{box-shadow:0 2px 0 #B58430;}
.home-foot .btn{flex:1;}

/* ---------- 关卡页 ---------- */
.page-head{display:flex;align-items:center;gap:10px;}
.icon-btn{
  width:38px;height:38px;flex:0 0 38px;border-radius:12px;border:none;background:#fff;
  box-shadow:0 3px 10px rgba(26,107,90,.14);font-size:16px;color:var(--ink2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.icon-btn:active{transform:scale(.94)}
.page-head h2{font-size:18px;font-weight:900;letter-spacing:1px;font-family:"Songti SC","SimSun",serif;}
.page-head .spacer{flex:1;}
.level-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:12px;padding-bottom:10px;}
.level-list{display:flex;flex-direction:column;gap:11px;}
.lv{
  display:flex;align-items:center;gap:13px;background:#fff;border-radius:18px;padding:13px 15px;
  box-shadow:var(--sh);cursor:pointer;border:2px solid transparent;transition:.15s;position:relative;
}
.lv:active{transform:scale(.98);}
.lv .num{
  width:48px;height:48px;flex:0 0 48px;border-radius:14px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px;
}
.lv .num small{font-size:8px;font-weight:700;opacity:.85;letter-spacing:1px;}
.lv .nm{font-size:15px;font-weight:800;letter-spacing:.5px;}
.lv .nm .done{font-size:11px;color:var(--gold);margin-left:6px;}
.lv .sub{font-size:11px;color:var(--ink2);margin-top:3px;font-weight:600;}
.lv .stars{margin-left:auto;font-size:15px;letter-spacing:2px;filter:grayscale(1);opacity:.25;}
.lv .stars.on{filter:none;opacity:1;}
.lv.locked{opacity:.55;}
.lv.locked .num{background:#B9C4BE !important;}
.lv .theme-tag{
  font-size:9px;font-weight:800;color:#fff;padding:2px 7px;border-radius:8px;margin-left:8px;vertical-align:2px;
}

/* ---------- 答题页 ---------- */
.q-top{display:flex;align-items:center;gap:10px;}
.q-info{font-size:12px;font-weight:800;color:var(--ink2);min-width:64px;text-variant:tabular-nums;font-variant-numeric:tabular-nums;}
.combo{
  font-size:12px;font-weight:900;color:var(--gold);
  background:rgba(217,164,65,.13);border-radius:11px;padding:6px 10px;
  animation:comboPop .3s;
}
@keyframes comboPop{0%{transform:scale(.6)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.hp-wrap{flex:1;height:11px;border-radius:7px;background:#E7EDE9;overflow:hidden;position:relative;}
.hp{height:100%;width:100%;border-radius:7px;background:linear-gradient(90deg,#2CB283,#1A8F6E);transition:width .35s;}
.hp.low{background:linear-gradient(90deg,#E07856,#D65A4A);}

.q-main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;position:relative;}
.q-type-tag{
  align-self:center;font-size:11px;font-weight:800;letter-spacing:2px;color:#fff;
  padding:5px 15px;border-radius:20px;background:linear-gradient(90deg,#20795F,#2CB283);
}
.q-poem{
  background:#fff;border-radius:22px;box-shadow:var(--sh);padding:22px 18px;
  display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;overflow:hidden;
}
.q-poem::before{
  content:"诗";position:absolute;right:-8px;bottom:-18px;font-size:88px;color:rgba(26,107,90,.05);
  font-family:"Songti SC","SimSun",serif;font-weight:900;
}
.q-title{font-size:16px;font-weight:900;font-family:"Songti SC","SimSun",serif;letter-spacing:1px;}
.q-author{font-size:12px;color:var(--ink2);font-weight:600;}
.q-line{
  font-size:24px;font-weight:700;font-family:"Songti SC","STSong","SimSun",serif;
  letter-spacing:2px;line-height:1.8;text-align:center;width:100%;
}
.blank{
  display:inline-block;min-width:78px;border-bottom:2.5px solid var(--gold);
  color:var(--green);font-weight:900;text-align:center;padding:0 6px;transition:.15s;
}
.blank.err{color:var(--red);border-color:var(--red);animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.q-tip{font-size:12px;color:var(--ink2);font-weight:700;text-align:center;}

.opts{display:flex;flex-direction:column;gap:10px;}
.opt{
  background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 16px;
  font-family:"Songti SC","STSong","SimSun",serif;font-size:18px;font-weight:700;color:var(--ink);
  letter-spacing:1px;cursor:pointer;transition:.14s;text-align:center;
  box-shadow:0 3px 0 rgba(26,107,90,.08);
}
.opt:active{transform:translateY(2px);box-shadow:none;}
.opt .au{font-size:13px;color:var(--ink2);font-weight:600;font-family:-apple-system,"PingFang SC",sans-serif;display:block;margin-top:3px;}
.opt.right{background:#EBF8F1;border-color:var(--green);color:var(--green-d);}
.opt.wrong{background:#FDF0EE;border-color:var(--red);color:var(--red);animation:shake .3s;}
.opt.dim{opacity:.4;}

/* 排序题 */
.order-pool,.order-line{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.order-line{
  min-height:56px;background:#fff;border-radius:16px;border:2px dashed #D8CFAF;
  padding:9px;box-shadow:var(--sh);
}
.frag{
  background:linear-gradient(180deg,#FFFDF6,#F7EFDC);border:1.5px solid #E0D3A8;border-radius:12px;
  padding:10px 13px;font-size:17px;font-weight:700;font-family:"Songti SC","SimSun",serif;
  letter-spacing:1px;cursor:pointer;transition:.13s;box-shadow:0 2px 0 rgba(181,132,48,.2);
}
.frag:active{transform:scale(.95);}
.frag.used{opacity:.3;pointer-events:none;}
.frag.slot{
  background:#EBF8F1;border-color:var(--green);color:var(--green-d);cursor:pointer;
}
.order-actions{display:flex;gap:10px;}
.order-actions .btn{flex:1;font-size:14px;padding:12px;}

/* 填字题候选 */
.chars{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;}
.char-b{
  width:52px;height:52px;border-radius:14px;background:#fff;border:2px solid var(--line);
  font-family:"Songti SC","SimSun",serif;font-size:23px;font-weight:800;color:var(--ink);
  cursor:pointer;transition:.13s;box-shadow:0 3px 0 rgba(26,107,90,.08);
}
.char-b:active{transform:translateY(2px);box-shadow:none;}
.char-b.used{opacity:.25;pointer-events:none;}

/* 反馈浮层 */
.feedback{
  position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:15px;font-weight:900;
  opacity:0;transition:.25s;pointer-events:none;z-index:50;
}
.feedback.show{opacity:1;}
.feedback.ok{color:var(--green);}
.feedback.no{color:var(--red);}
.feedback small{display:block;font-size:12px;color:var(--ink2);font-weight:700;margin-top:2px;}

/* ---------- 结算 ---------- */
.result-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.result-hero{text-align:center;padding:14px 0 4px;}
.big-em{font-size:60px;display:inline-block;animation:pop .6s cubic-bezier(.2,1.4,.5,1);}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.result-title{font-size:23px;font-weight:900;margin-top:8px;letter-spacing:2px;font-family:"Songti SC","SimSun",serif;}
.result-sub{font-size:12px;color:var(--ink2);margin-top:5px;font-weight:600;line-height:1.6;}
.star-row{display:flex;justify-content:center;gap:7px;font-size:30px;margin-top:10px;}
.star-row span{filter:grayscale(1);opacity:.25;transition:.3s;}
.star-row span.on{filter:none;opacity:1;animation:pop .5s cubic-bezier(.2,1.4,.5,1) both;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;}
.stat{background:#fff;border-radius:18px;padding:13px 6px;text-align:center;box-shadow:var(--sh);}
.stat .v{font-size:20px;font-weight:900;color:var(--green);font-variant-numeric:tabular-nums;}
.stat .k{font-size:11px;color:var(--ink2);font-weight:700;margin-top:3px;}
.stat.g .v{color:var(--gold)}
.review{margin-top:14px;background:#fff;border-radius:20px;padding:15px;box-shadow:var(--sh);}
.review h4{font-size:14px;font-weight:800;margin-bottom:10px;}
.rv-item{
  padding:10px 12px;border-radius:13px;background:#F6F9F6;margin-bottom:8px;
  font-family:"Songti SC","SimSun",serif;font-size:15px;line-height:1.7;
}
.rv-item b{font-size:11px;color:var(--ink2);display:block;font-family:-apple-system,"PingFang SC",sans-serif;margin-bottom:2px;}
.rv-item .hl{color:var(--green-d);font-weight:900;border-bottom:2px solid var(--gold);}
.rv-item.no{background:#FDF4F2;}
.rv-item.no .hl{color:var(--red);border-color:var(--red);}
.result-foot{display:flex;flex-direction:column;gap:9px;padding-top:12px;}
.result-foot .row{display:flex;gap:9px;}
.result-foot .row .btn{flex:1;font-size:15px;padding:14px;}

/* 收集册 */
.coll-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:12px;}
.coll-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.card{
  background:#fff;border-radius:16px;padding:13px;box-shadow:var(--sh);
  border-top:3px solid var(--gold);
}
.card .t{font-size:14px;font-weight:900;font-family:"Songti SC","SimSun",serif;}
.card .a{font-size:11px;color:var(--ink2);margin-top:2px;font-weight:600;}
.card .l{font-size:12px;margin-top:7px;font-family:"Songti SC","SimSun",serif;line-height:1.65;color:var(--ink);letter-spacing:.5px;}
.card .l .hl{color:var(--green-d);font-weight:900;}
.card.miss{opacity:.5;border-top-color:#CBD5CF;}
.card .lock-tag{font-size:11px;color:var(--ink2);font-weight:700;}

/* 覆盖层 */
.overlay{
  position:absolute;inset:0;background:rgba(31,42,38,.55);backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;
  padding:26px;z-index:100;opacity:0;visibility:hidden;transition:.22s;
}
.overlay.show{opacity:1;visibility:visible;}
.dialog{
  background:#fff;border-radius:24px;padding:22px 20px;width:100%;max-width:320px;text-align:center;
  transform:scale(.9);transition:.24s cubic-bezier(.2,1.3,.5,1);
}
.overlay.show .dialog{transform:scale(1);}
.dialog .em{font-size:42px;}
.dialog h3{font-size:18px;font-weight:900;margin-top:8px;}
.dialog p{font-size:13px;color:var(--ink2);margin-top:7px;line-height:1.7;font-weight:600;}
.dialog .acts{display:flex;gap:9px;margin-top:18px;}
.dialog .acts .btn{flex:1;font-size:15px;padding:13px;}

/* 飘字 */
.float-score{
  position:absolute;left:50%;top:42%;transform:translateX(-50%);
  font-size:26px;font-weight:900;color:var(--gold);pointer-events:none;z-index:60;
  animation:rise 1s ease-out forwards;text-shadow:0 2px 0 rgba(255,255,255,.8);
}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}25%{opacity:1;transform:translate(-50%,-6px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
.toast{
  position:absolute;left:50%;top:64px;transform:translate(-50%,-14px);
  background:rgba(31,42,38,.92);color:#fff;font-size:13px;font-weight:700;
  padding:10px 18px;border-radius:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0);}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:90;}
@media (max-height:660px){
  .seal{width:62px;height:62px;font-size:30px}.title{font-size:23px}
  .poem-quote{margin-top:8px;font-size:12px;padding:7px 14px}
  .stage{padding:11px 4px 9px}.stage .glyph{font-size:24px}
  .q-line{font-size:20px}.opt{font-size:16px;padding:11px 14px}
  .stat-c .v{font-size:15px}
}
</style>
</head>
<body>
<div id="app">

  <!-- 首页 -->
  <section class="screen active" id="screen-home">
   <div class="home-scroll">
    <div class="home-head">
      <div class="seal">诗</div>
      <div class="title">诗境<em>闯关</em></div>
      <div class="subtitle">熟读唐诗三百首 · 不会作诗也会吟</div>
    </div>
    <div class="poem-quote" id="quoteBox"></div>
    <div class="stage-grid" id="stageGrid"></div>
    <div class="stat-row">
      <div class="stat-c"><div class="v" id="stCleared">0</div><div class="k">已通关</div></div>
      <div class="stat-c"><div class="v" id="stStars">0</div><div class="k">累计星星</div></div>
      <div class="stat-c"><div class="v" id="stCards">0</div><div class="k">诗词收集</div></div>
    </div>
   </div>
    <div class="home-foot">
      <button class="btn ghost" id="btnCollect">📜 收集册</button>
      <button class="btn gold" id="btnReset">🔄 重来</button>
      <button class="btn" id="btnQuick">随机挑战</button>
    </div>
  </section>

  <!-- 关卡页 -->
  <section class="screen" id="screen-levels">
    <div class="page-head">
      <button class="icon-btn" id="btnLvBack">←</button>
      <h2 id="lvTitle">小学阶段</h2>
      <div class="spacer"></div>
      <div class="combo" id="lvProg">0/6</div>
    </div>
    <div class="level-wrap"><div class="level-list" id="levelList"></div></div>
  </section>

  <!-- 答题页 -->
  <section class="screen" id="screen-quiz">
    <div class="q-top">
      <button class="icon-btn" id="btnQQuit">✕</button>
      <div class="q-info" id="qInfo">第 1/5 题</div>
      <div class="hp-wrap"><div class="hp" id="hpBar"></div></div>
      <div class="combo" id="comboBox" style="display:none;">连击 ×2</div>
    </div>
    <div class="q-main" id="qMain"></div>
    <div class="feedback" id="fb"></div>
  </section>

  <!-- 结算 -->
  <section class="screen" id="screen-result">
    <div class="result-wrap">
      <div class="result-hero">
        <div class="big-em" id="rEm">🏆</div>
        <div class="result-title" id="rTitle">过关！</div>
        <div class="result-sub" id="rSub"></div>
        <div class="star-row" id="rStars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
      </div>
      <div class="stat-grid">
        <div class="stat"><div class="v" id="rTotal">0</div><div class="k">题目</div></div>
        <div class="stat"><div class="v" id="rRight">0</div><div class="k">答对</div></div>
        <div class="stat g"><div class="v" id="rScore">0</div><div class="k">得分</div></div>
      </div>
      <div class="review" id="reviewBox">
        <h4>📖 诗词回顾</h4>
        <div id="reviewList"></div>

/* ================= 存档 ================= */
const LS='poem_quest_v1';
let save = loadSave();
function loadSave(){
  try{
    const d = JSON.parse(localStorage.getItem(LS));
    if(d && d.lv && d.cards) return d;
  }catch(e){}
  return {lv:{primary:1,junior:1,senior:1}, stars:{}, cards:[], totalScore:0};
}
function persist(){ try{ localStorage.setItem(LS, JSON.stringify(save)); }catch(e){} }

/* ================= 状态 ================= */
const S = {
  stage:'primary', lv:0,
  questions:[], idx:0, right:0, score:0, combo:0,
  records:[], locked:false, quick:false
};

/* ================= 音效 ================= */
let actx=null;
function ac(){ if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}} if(actx&&actx.state==='suspended')actx.resume(); return actx; }
function tone(fr,fr2,dur,type){
  const c=ac(); if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);o.type=type||'sine';
  o.frequency.setValueAtTime(fr,c.currentTime);
  if(fr2)o.frequency.setValueAtTime(fr2,c.currentTime+0.08);
  g.gain.setValueAtTime(0.07,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
  o.start();o.stop(c.currentTime+dur+0.02);
}
const sndRight=()=>tone(660,990,0.25);
const sndWrong=()=>tone(280,190,0.28,'triangle');
const sndStar=i=>tone([660,830,1040][i]||880,null,0.3,'triangle');
const sndClick=()=>tone(500,null,0.06);

/* ================= 首页 ================= */
function renderHome(){
  const q = QUOTES[rnd(QUOTES.length)];
  $('#quoteBox').innerHTML = `「${q[0]}」<b>—— ${q[1]}</b>`;
  const g = $('#stageGrid');
  g.innerHTML = ['primary','junior','senior'].map(k=>{
    const m = STAGE_META[k];
    const cleared = save.lv[k]-1;
    let stars=0;
    for(let i=0;i<cleared;i++){ stars += save.stars[k+'_'+i]||0; }
    return `<div class="stage ${k}" data-k="${k}">
      <div class="glyph">${m.glyph}</div>
      <div class="nm">${m.nm}</div>
      <div class="info">第 ${Math.min(cleared+1,6)} 关 / 6</div>
      <div class="bar"><i style="width:${cleared/6*100}%"></i></div>
    </div>`;
  }).join('');
  $$('#stageGrid .stage').forEach(el=>{
    el.onclick = ()=>{ ac(); sndClick(); S.stage = el.dataset.k; openLevels(); };
  });
  $('#stCleared').textContent = (save.lv.primary-1)+(save.lv.junior-1)+(save.lv.senior-1);
  let allStars=0; for(const k in save.stars) allStars+=save.stars[k];
  $('#stStars').textContent = allStars;
  $('#stCards').textContent = save.cards.length;
}

/* ================= 关卡页 ================= */
function openLevels(){
  const m = STAGE_META[S.stage];
  $('#lvTitle').textContent = m.nm + ' · ' + (S.stage==='primary'?'启蒙':S.stage==='junior'?'进阶':'登峰');
  const unlocked = save.lv[S.stage];
  const list = $('#levelList');
  list.innerHTML = LEVELS[S.stage].map((nm,i)=>{
    const locked = i+1 > unlocked;
    const st = save.stars[S.stage+'_'+i]||0;
    return `<div class="lv ${locked?'locked':''}" data-i="${i}">
      <div class="num" style="background:${locked?'':m.color}">${i+1}<small>关</small></div>
      <div><div class="nm">${nm}</div><div class="sub">${locked?'通关上一关解锁':'5 题 · '+typeHint(S.stage,i)}</div></div>
      <div class="stars ${st?'on':''}">${'⭐'.repeat(st)||'☆☆☆'}</div>
    </div>`;
  }).join('');
  const cleared = unlocked-1;
  $('#lvProg').textContent = cleared+'/6';
  $$('#levelList .lv').forEach(el=>{
    el.onclick = ()=>{
      const i = +el.dataset.i;
      if(i+1 > save.lv[S.stage]){ toast('先通关上一关才能解锁哦'); sndWrong(); return; }
      ac(); sndClick();
      S.lv = i; S.quick=false;
      startLevel(S.stage, i);
    };
  });
  showScreen('screen-levels');
}
function typeHint(stage,i){
  const qs = BANK[stage].slice(i*6, i*6+6);
  const set = new Set(qs.map(q=>q.type));
  const names = {1:'补句',2:'文学常识',3:'填字',4:'排序'};
  return [...set].map(t=>names[t]).join(' · ') || '补句';
}

/* ================= 出题 ================= */
function startLevel(stage, lvIdx){
  const qs = BANK[stage].slice(lvIdx*6, lvIdx*6+6);
  S.questions = shuffle(qs);
  beginQuiz(false);
}
function startQuick(){
  // 随机从全部题库抽 8 题
  const all = [];
  for(const k in BANK) BANK[k].forEach((q,i)=>all.push(Object.assign({stage:k},q)));
  S.questions = shuffle(all).slice(0,8);
  beginQuiz(true);
}
function beginQuiz(quick){
  S.idx=0; S.right=0; S.score=0; S.combo=0; S.records=[]; S.locked=false; S.quick=!!quick;
  showScreen('screen-quiz');
  updateHp();
  renderQ();
}
function updateHp(){
  const pct = S.idx / S.questions.length * 100;
  const bar = $('#hpBar');
  bar.style.width = (100-pct) + '%';
  bar.classList.toggle('low', (100-pct) < 34);
}

/* ================= 渲染题目 ================= */
function renderQ(){
  const q = S.questions[S.idx];
  const total = S.questions.length;
  $('#qInfo').textContent = `第 ${S.idx+1}/${total} 题`;
  S.locked = false;
  const main = $('#qMain');
  const typeNames = {1:'补全诗句',2:'文学常识',3:'一字千金',4:'诗句排序'};
  let html = `<div class="q-type-tag">${typeNames[q.type]}</div>`;

  if(q.type===1){
    html += `<div class="q-poem">
      <div class="q-title">《${q.t}》</div>
      <div class="q-author">${q.d} · ${q.a}</div>
      <div class="q-line">${q.l1}<span class="blank" id="blank"></span></div>
    </div>
    <div class="opts">${shuffle(q.opts.map((o,i)=>({o,i}))).map(x=>
      `<button class="opt" data-v="${x.i}">${x.o}</button>`).join('')}</div>`;
  }
  else if(q.type===2){
    html += `<div class="q-poem">
      <div class="q-title">《${q.t}》</div>
      <div class="q-line" style="font-size:20px">${q.l1}</div>
      <div class="q-tip">${q.q}</div>
    </div>
    <div class="opts">${shuffle(q.opts.map((o,i)=>({o,i}))).map(x=>
      `<button class="opt" style="font-size:16px" data-v="${x.i}">${x.o}</button>`).join('')}</div>`;
  }
  else if(q.type===3){
    html += `<div class="q-poem">
      <div class="q-title">《${q.t}》</div>
      <div class="q-author">${q.d} · ${q.a}</div>
      <div class="q-line">${q.l1}</div>
      <div class="q-tip">${q.q}</div>
      <div class="blank" id="blank" style="font-size:24px;min-width:60px;">　</div>
    </div>
    <div class="chars">${shuffle(q.chars).map(c=>
      `<button class="char-b" data-v="${c}">${c}</button>`).join('')}</div>`;
  }
  else if(q.type===4){
    html += `<div class="q-tip" style="font-weight:800">${q.l1}</div>
      <div class="order-line" id="orderLine"></div>
      <div class="order-pool" id="orderPool">${q.q.map((f,i)=>
        `<button class="frag" data-i="${i}">${f}</button>`).join('')}</div>
      <div class="order-actions">
        <button class="btn ghost" id="orderReset">↺ 重排</button>
        <button class="btn" id="orderOk">确认 ✓</button>
      </div>`;
  }
  main.innerHTML = html;
  $('#fb').className='feedback';

  if(q.type===1||q.type===2){
    $$('#qMain .opt').forEach(b=>{
      b.onclick = ()=>answer(b, q.opts[+b.dataset.v]);
    });
  }else if(q.type===3){
    $$('#qMain .char-b').forEach(b=>{
      b.onclick = ()=>answer(b, b.dataset.v);
    });
  }else if(q.type===4){
    const line = $('#orderLine'), pool = $('#orderPool');
    S.order = [];
    pool.addEventListener('click', e=>{
      const f = e.target.closest('.frag');
      if(!f || S.locked) return;
      sndClick();
      f.classList.add('used');
      const slot = document.createElement('button');
      slot.className='frag slot'; slot.textContent=f.textContent; slot.dataset.i=f.dataset.i;
      slot.onclick = ()=>{
        if(S.locked) return;
        slot.remove();
        pool.querySelector(`.frag[data-i="${slot.dataset.i}"]`).classList.remove('used');
        S.order = S.order.filter(x=>x!==slot.dataset.i);
      };
      line.appendChild(slot);
      S.order.push(f.dataset.i);
    });
    $('#orderReset').onclick = ()=>{
      if(S.locked) return;
      line.innerHTML=''; S.order=[];
      $$('#orderPool .frag').forEach(f=>f.classList.remove('used'));
    };
    $('#orderOk').onclick = ()=>{
      if(S.locked) return;
      if(S.order.length < q.q.length){ toast('还有字词没有排上哦'); return; }
      const ok = S.order.every((v,i)=>+v===q.ans[i]);
      settle(ok, null, q);
    };
  }
}

/* ================= 答题逻辑 ================= */
function answer(btn, val){
  if(S.locked) return;
  const q = S.questions[S.idx];
  let ok;
  if(q.type===1||q.type===2) ok = val === q.opts[0];
  else if(q.type===3) ok = val === q.ans;
  btn.classList.add(ok?'right':'wrong');
  if(!ok){
    // 标出正确项
    if(q.type===1||q.type===2){
      $$('#qMain .opt').forEach(b=>{ if(q.opts[+b.dataset.v]===q.opts[0]) b.classList.add('right'); else b.classList.add('dim'); });
    }else if(q.type===3){
      $$('#qMain .char-b').forEach(b=>{ if(b.dataset.v===q.ans){b.classList.add('right');b.classList.remove('used');} else b.classList.add('dim'); });
    }
  }
  settle(ok, btn, q, val);
}

function settle(ok, btn, q, val){
  S.locked = true;
  const blank = $('#blank');
  const ctext = q.type===4 ? q.q.map((f,i)=>q.q[q.ans[i]]).join('')
    : q.type===3 ? q.ans : q.opts[0];
  S.records.push({q, ok, correctText:ctext});

  if(ok){
    S.combo++;
    const bonus = S.combo>=3 ? 20 : 0;
    S.score += 100 + bonus;
    S.right++;
    if(blank){ blank.textContent = ctext; }
    showFb(true, S.combo>=3?`连击 ×${S.combo}！+${100+bonus} 分`:'+100 分');
    floatScore();
    sndRight();
    setTimeout(next, 850);
  }else{
    S.combo = 0;
    if(blank && (q.type===1||q.type===3)){ blank.textContent = btn? String(val) : '　'; blank.classList.add('err'); }
    if(blank && q.type===3){ blank.textContent = val; blank.classList.add('err'); }
    showFb(false, `正确答案：${ctext}`);
    sndWrong();
    setTimeout(next, 1600);
  }
  updateHp();
}
function showFb(ok, txt){
  const fb = $('#fb');
  fb.innerHTML = txt;
  fb.className = 'feedback show ' + (ok?'ok':'no');
}
function floatScore(){
  const main = $('#qMain');
  const el = document.createElement('div');
  el.className='float-score'; el.textContent='+' + (100 + (S.combo>=3?20:0));
  main.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}
function next(){
  S.idx++;
  if(S.idx >= S.questions.length){ finish(); return; }
  renderQ();
}

/* ================= 结算 ================= */
function finish(){
  const total = S.questions.length;
  const rate = Math.round(S.right/total*100);
  let stars = rate===100?3 : rate>=80?2 : rate>=60?1 : 0;
  // 星星加成
  const pass = rate>=60;
  $('#rEm').textContent = rate===100?'🏆':rate>=80?'🎖️':pass?'🏅':'📕';
  $('#rTitle').textContent = rate===100?'妙笔生花！':rate>=80?'出口成章！':pass?'初窥门径':'再读诗书';
  const sub = rate===100?'全对！你对诗词的领悟令人赞叹':rate>=80?'只差一点点就满分啦':pass?'顺利过关，继续加油':'多读几遍，诗境自现';
  $('#rSub').textContent = sub;
  $('#rTotal').textContent = total;
  $('#rRight').textContent = S.right;
  $('#rScore').textContent = S.score;

  const starEls = $('#rStars').children;
  for(let i=0;i<3;i++){
    starEls[i].classList.remove('on');
    if(i<stars) setTimeout(()=>{ starEls[i].classList.add('on'); sndStar(i); }, 250+i*250);
  }

  // 回顾
  $('#reviewList').innerHTML = S.records.map(r=>{
    const q = r.q;
    const line = q.type===1 ? `${q.l1}<span class="hl">${q.opts[0]}</span>`
      : q.type===2 ? `${q.l1}<br><span class="hl">${q.opts[0]}</span>`
      : q.type===3 ? `${q.l1}（<span class="hl">${q.ans}</span>）`
      : `<span class="hl">${r.correctText}</span>`;
    return `<div class="rv-item ${r.ok?'':'no'}"><b>《${q.t}》 ${q.d} · ${q.a} ${r.ok?'✅':'❌'}</b>${line}</div>`;
  }).join('');

  // 进度与收集
  if(!S.quick && pass){
    const key = S.stage+'_'+S.lv;
    const old = save.stars[key]||0;
    if(stars>old) save.stars[key]=stars;
    const nextUnlocked = S.lv+2;
    if(nextUnlocked > save.lv[S.stage] && nextUnlocked<=6){
      save.lv[S.stage] = nextUnlocked;
      toast('🔓 新关卡已解锁！');
    }
    S.records.forEach(r=>{
      if(!save.cards.find(c=>c.t===r.q.t)){
        save.cards.push({t:r.q.t,a:r.q.a,d:r.q.d,l:r.q.l1+(r.q.type===1?r.q.opts[0]:'')});
      }
    });
  }
  save.totalScore += S.score;
  persist();

  // 下一关按钮
  const hasNext = !S.quick && pass && S.lv+1 < 6;
  $('#btnNextLv').style.display = hasNext?'block':'none';

  showScreen('screen-result');
  if(rate===100) confettiRain();
}

/* ================= 收集册 ================= */
function renderCollect(){
  // 全部诗目标题（去重）
  const all = {};
  for(const k in BANK) BANK[k].forEach(q=>{
    if(!all[q.t]) all[q.t]=q;
  });
  const total = Object.keys(all).length;
  $('#collProg').textContent = save.cards.length+'/'+total;
  const owned = new Set(save.cards.map(c=>c.t));
  $('#collGrid').innerHTML = Object.keys(all).sort().map(t=>{
    const q = all[t];
    const has = owned.has(t);
    if(has){
      return `<div class="card">
        <div class="t">《${q.t}》</div><div class="a">${q.d} · ${q.a}</div>
        <div class="l">${q.l1}<span class="hl">${q.type===1?q.opts[0]:q.type===3?q.ans:''}</span></div>
      </div>`;
    }
    return `<div class="card miss"><div class="t">？？？</div><div class="a">尚未收录</div><div class="lock-tag">通关对应关卡解锁</div></div>`;
  }).join('');
}

/* ================= 屏幕切换 & 事件 ================= */
function showScreen(id){
  window.scrollTo(0,0);
  $$('.screen').forEach(s=>s.classList.remove('active'));
  $('#'+id).classList.add('active');
}
let toastT=null;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1600);
}
function confettiRain(){
  const box=$('#confetti');
  const chars=['⭐','✨','🌟','📜','🏮','🎊','💫'];
  for(let i=0;i<28;i++){
    const d=document.createElement('div');
    d.textContent=chars[rnd(chars.length)];
    d.style.cssText=`position:absolute;top:-40px;left:${rnd(100)}%;font-size:${14+rnd(16)}px;animation:fall ${1.6+Math.random()*1.4}s linear ${Math.random()*0.7}s forwards;`;
    box.appendChild(d);
    setTimeout(()=>d.remove(),3800);
  }
  if(!document.getElementById('fallKf')){
    const st=document.createElement('style');st.id='fallKf';
    st.textContent='@keyframes fall{to{transform:translateY(110vh) rotate(420deg);opacity:.1}}';
    document.head.appendChild(st);
  }
}

/* 事件 */
$('#btnLvBack').onclick = ()=>{ sndClick(); renderHome(); showScreen('screen-home'); };
$('#btnQuick').onclick = ()=>{ ac(); sndClick(); startQuick(); };
$('#btnCollect').onclick = ()=>{ sndClick(); renderCollect(); showScreen('screen-collect'); };
$('#btnCollBack').onclick = ()=> showScreen('screen-home');
$('#btnReset').onclick = ()=>{
  if(confirm('确定清空全部闯关进度和收集吗？')){
    save = {lv:{primary:1,junior:1,senior:1},stars:{},cards:[],totalScore:0};
    persist(); renderHome(); toast('已重新开始');
  }
};
$('#btnQQuit').onclick = ()=> $('#ovQuit').classList.add('show');
$('#ovQuitNo').onclick = ()=> $('#ovQuit').classList.remove('show');
$('#ovQuitYes').onclick = ()=>{ $('#ovQuit').classList.remove('show'); showScreen('screen-levels'); };
$('#btnRetry').onclick = ()=>{
  if(S.quick) startQuick(); else startLevel(S.stage, S.lv);
};
$('#btnResHome').onclick = ()=>{
  if(S.quick){ renderHome(); showScreen('screen-home'); }
  else openLevels();
};
$('#btnNextLv').onclick = ()=>{ S.lv++; startLevel(S.stage, S.lv); };
document.addEventListener('touchstart', function once(){ ac(); document.removeEventListener('touchstart', once); }, {passive:true});
document.addEventListener('touchmove', function(e){
  if(!e.target.closest('.level-wrap,.result-wrap,.coll-wrap,.home-scroll')) e.preventDefault();
}, {passive:false});

renderHome();
})();
</script>
